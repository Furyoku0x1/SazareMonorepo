[profile.default]
src = "src"
out = "out"
libs = ["../lib"]
# Resolve production imports from the shared libraries, not upstream dev submodules.
auto_detect_remappings = false
# Uniswap v4 uses transient storage (EIP-1153).
evm_version = "cancun"
# Keep KernelHook compatible with Solidity's standard compilation pipeline.
via_ir = false
# Standard optimization keeps deployed contracts within the bytecode size limits.
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=../lib/forge-std/src/",
    "@openzeppelin/contracts/=../lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=../lib/v4-core/",
    "v4-core/=../lib/v4-core/",
    "@uniswap/v4-periphery/=../lib/v4-periphery/",
    "v4-periphery/=../lib/v4-periphery/",
    "@uniswap/v4-hooks-public/=../lib/v4-hooks-public/",
    "v4-hooks-public/=../lib/v4-hooks-public/",
    "uniswap-hooks/=../lib/uniswap-hooks/",
    "permit2/=../lib/permit2/",
    "solmate/=../lib/solmate/",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
