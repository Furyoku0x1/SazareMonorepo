[profile.default]
src = "src"
out = "out"
libs = ["../lib"]
allow_paths = ["../core"]
# Resolve production imports from the shared libraries, not upstream dev submodules.
auto_detect_remappings = false
# Uniswap v4 uses transient storage (EIP-1153).
evm_version = "cancun"
remappings = [
    "core/=../core/",
    "forge-std/=../lib/forge-std/src/",
    "oz/contracts/=../lib/openzeppelin-contracts/contracts/",
    "v4-core/=../lib/v4-core/",
    "v4-periphery/=../lib/v4-periphery/",
    "v4-hooks/=../lib/v4-hooks-public/",
    "permit2/=../lib/permit2/",
    "solmate/=../lib/solmate/",
]
solc = "0.8.37"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
