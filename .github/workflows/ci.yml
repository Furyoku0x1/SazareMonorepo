name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry / ${{ matrix.project }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [tokens, hooks, add-ons, core]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check --root "${{ matrix.project }}"

      - name: Run Forge build
        run: forge build --sizes --root "${{ matrix.project }}"

      - name: Run Forge tests
        run: forge test -vvv --root "${{ matrix.project }}"
